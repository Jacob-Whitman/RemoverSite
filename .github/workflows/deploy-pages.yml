name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the GitHub Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. Do not cancel in-progress deploys so
# partial deploys don't leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # -------------------------------------------------------
          # VITE_BASE_PATH:
          #   Use '/' if serving from a custom domain or from an
          #   org/user Pages root repo (e.g. baseline-solutions.github.io).
          #   Use '/<repo-name>/' for project Pages without a custom
          #   domain (e.g. github.com/org/baseline-privacy-removal
          #   served at org.github.io/baseline-privacy-removal/).
          # -------------------------------------------------------
          VITE_BASE_PATH: /RemoverSite/
          # Public Supabase values — safe to include in the frontend build
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Public Turnstile site key — safe to include in the frontend build
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_APP_ENV: production
          # NOTE: NEVER add CLOUDFLARE_TURNSTILE_SECRET_KEY or
          # SUPABASE_SERVICE_ROLE_KEY here. Those must only exist in
          # Supabase Edge Function secrets.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
