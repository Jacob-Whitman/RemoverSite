name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Use placeholder values for CI build — no real secrets in CI
          # The app will fail to connect to Supabase at runtime without real values,
          # but the build itself only needs non-empty strings to pass.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_TURNSTILE_SITE_KEY: placeholder-site-key
          VITE_APP_ENV: ci
          # Use '/' for the CI build. The deploy workflow sets this appropriately.
          VITE_BASE_PATH: /
